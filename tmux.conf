#######################################
##   Configuration
#######################################

set-option -g default-shell /bin/zsh
set -g history-limit 50000
setw -g mode-keys vi
set -g mouse on

set-option -g base-index 1
set-window-option -g pane-base-index 1

# Renumber windows when one is closed (no gaps)
set -g renumber-windows on

# Faster escape time (default 500ms feels sluggish, especially in vim)
set -sg escape-time 10

# Increase display time for status messages and pane indicators
set -g display-time 2000
set -g display-panes-time 2000

# Focus events for editors that care about gaining/losing focus
set -g focus-events on

# Better copy/paste — yank to system clipboard in copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

#######################################
##   Navigation
#######################################

# Split panes (your existing bindings)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows open in current directory too
bind c new-window -c "#{pane_current_path}"

# Move between panes with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with Prefix + arrow
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

#######################################
##   Visual
#######################################

# Status bar on top (easier to see with lots of panes)
set -g status-position top

# Muted status bar — not distracting
set -g status-style "bg=default,fg=white"
set -g status-left "[#S] "
set -g status-right "%H:%M"

# Active pane border stands out
set -g pane-active-border-style "fg=cyan"
set -g pane-border-style "fg=brightblack"
